[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mach-zehnder-spc"
version = "0.1.0"
description = "Elitzur-Vaidman Interaction-Free Mach-Zehnder Predictive Coding with Concentric Phase Mirrors and Symplectic Geodesic Deflection"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "shu195"}
]
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mach_zehnder_spc*"]
